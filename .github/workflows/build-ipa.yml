name: Build EdgeReturn IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SCHEME: "EdgeReturn"
  PROJECT: "EdgeReturn.xcodeproj"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || true
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            ARCH=$(uname -m)
            curl -L -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen-macos-${ARCH}.zip"
            unzip -o /tmp/xcodegen.zip -d /tmp/xcodegen-bin
            chmod +x /tmp/xcodegen-bin/xcodegen
            sudo mv /tmp/xcodegen-bin/xcodegen /usr/local/bin/xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # Unsigned device build. No keychain, no certificate, no provisioning
      # profile: CODE_SIGNING_ALLOWED=NO. The output .app is signed later,
      # on-device, by LiveContainer + SideStore (the same flow used for WDA).
      - name: Build (unsigned, device arm64)
        run: |
          set -e
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/EdgeReturn.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            | tee build/archive.log | tail -n 40

      - name: Package unsigned IPA
        run: |
          set -e
          APP=build/EdgeReturn.xcarchive/Products/App/EdgeReturn.app
          if [ ! -d "$APP" ]; then
            echo "::error::Built app not found at $APP"
            tail -n 40 build/archive.log
            exit 1
          fi
          # Confirm it is a device (arm64) binary, not simulator.
          lipo -info "$APP/EdgeReturn" || true
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          ( cd Payload && zip -r -X ../EdgeReturn-unsigned.ipa . )
          ls -la build/EdgeReturn-unsigned.ipa
          # Strip the (empty) _CodeSignature so on-device signers start clean.
          rm -rf Payload/EdgeReturn.app/_CodeSignature
          rm -f build/EdgeReturn-unsigned.ipa
          ( cd Payload && zip -r -X ../EdgeReturn-unsigned.ipa . )
          ls -la build/EdgeReturn-unsigned.ipa

      - name: Show app Info.plist
        run: |
          plutil -p build/EdgeReturn.xcarchive/Products/App/EdgeReturn.app/Info.plist | head -n 40

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeReturn-unsigned.ipa
          path: build/EdgeReturn-unsigned.ipa

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/archive.log
