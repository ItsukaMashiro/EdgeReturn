name: EdgeReturn
options:
  bundleIdPrefix: com.itsukamashiro
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "YES"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  EdgeReturn:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsukamashiro.edgereturn
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Support/EdgeReturn.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Support/HIDPrivateAPI.h
        # Signing identity / team / profile are injected by the CI workflow.
